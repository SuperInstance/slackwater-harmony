[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slackwater-harmony"
version = "0.2.0"
description = "Cognitive friction monitoring and FEP-driven improvisation for multi-agent systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eileen"}]
keywords = ["harmony", "friction", "fep", "free-energy", "agents", "improvisation", "deadband"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["slackwater_harmony*"]
